[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "braz"
version = "1.0.1"
description = "Biblioteca e CLI para geracao, validacao, manipulacao e transformacao de dados"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
  { name = "dev-macb" },
]
dependencies = [
  "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/dev-macb/braz"
Repository = "https://github.com/dev-macb/braz"

[tool.hatch.envs.default]
features = ["dev"]

[project.scripts]
braz = "braz.cli.app:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
